server:
  port: 8080

spring:
  application:
    name: whu-developer-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/whu_developer?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:whu}
    password: ${SPRING_DATASOURCE_PASSWORD:whu}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:whu-top-developer-demo-jwt-secret-key-32bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  otp:
    expose: ${APP_OTP_EXPOSE:true}
    ttl-minutes: 10
  mail:
    from: ${APP_MAIL_FROM:noreply@whudev.org}
  reminder:
    scan-ms: ${APP_REMINDER_SCAN_MS:60000}
