# Listen port is the PORT env var (Dockerfile default 80). Render injects PORT,
# usually 10000, and routes the public proxy there. Compose does not set PORT.
#
# /api/ is proxied to the API_UPSTREAM origin. The official nginx image runs
# envsubst on this file at start. Compose default is http://api:8080.
# On Render free web services cannot receive private-network traffic, so set
# API_UPSTREAM to the API's public origin, for example
# https://whu-developer-api.onrender.com
# Do not use the private hostname whu-developer-api.
#
# The origin is a variable so nginx resolves it per request. A literal
# proxy_pass looks the host up at startup and exits with
# "host not found in upstream" when DNS is not ready. NGINX_RESOLVER is the
# container nameserver from /etc/resolv.conf (127.0.0.11 on Compose, which
# also forwards public queries; Render's platform DNS otherwise).
# Host and proxy_ssl_name are the API hostname so Render's edge and TLS SNI
# select that service. X-Forwarded-Proto keeps the caller scheme when the
# edge already set it.

map $http_x_forwarded_proto $forwarded_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
  resolver_timeout 5s;

  location /api/ {
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name ${API_UPSTREAM_SSL_NAME};
    proxy_set_header Host ${API_UPSTREAM_HOST};
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
