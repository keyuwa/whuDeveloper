# /api/ is proxied to http://${API_UPSTREAM} (envsubst at container start).
# Default is api:8080, the docker-compose service name.
# On Render set API_UPSTREAM=whu-developer-api:8080 (private DNS of the API service).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
